name: zuraffa_dashboard_ios
description: >-
  The iOS implementation of zuraffa_dashboard
  (NSUserDefaults-backed) persisting dashboard layouts on device.
version: 7.4.1
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

flutter:
  plugin:
    implements: zuraffa_dashboard
    platforms:
      ios:
        pluginClass: ZuraffaDashboardPlugin
        dartPluginClass: ZuraffaDashboardIOS

dependencies:
  flutter:
    sdk: flutter
  zuraffa_dashboard: ^7.4.1
  zuraffa_dashboard_platform_interface: ^7.4.1

dependency_overrides:
  xml: 7.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - dashboard
  - ios
  - zuraffa

repository: https://github.com/arrrrny/zuraffa_dashboard
issue_tracker: https://github.com/arrrrny/zuraffa_dashboard/issues
