name: zuraffa_dashboard_android
description: >-
  The Android implementation of zuraffa_dashboard
  (SharedPreferences-backed) persisting dashboard layouts on device.
version: 7.3.2
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

flutter:
  plugin:
    implements: zuraffa_dashboard
    platforms:
      android:
        package: com.zuraffa.dashboard
        pluginClass: ZuraffaDashboardPlugin
        dartPluginClass: ZuraffaDashboardAndroid

dependencies:
  flutter:
    sdk: flutter
  zuraffa_dashboard: ^7.3.2
  zuraffa_dashboard_platform_interface: ^7.3.2

dependency_overrides:
  # Fleet-wide xml policy: pin the override to the latest xml so graphs
  # that still transitively pull the abandoned minio (xml 6.x) resolve
  # cleanly. No sibling path stanzas — they poison the published archive
  # (pub does NOT strip overrides); local dev resolution rides a
  # gitignored pubspec_overrides.yaml.
  xml: 7.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - dashboard
  - android
  - zuraffa

repository: https://github.com/arrrrny/zuraffa_dashboard
issue_tracker: https://github.com/arrrrny/zuraffa_dashboard/issues
